[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bhoomicheck"
version = "0.1.0"
description = "Automated due diligence for land parcels in Telangana, India"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bhoomicheck"]
